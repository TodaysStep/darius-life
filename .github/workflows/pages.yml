name: Deploy public page to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # src/build.mjs reads the last commit date for "Last updated"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      # checks/run-all.mjs detects GitHub Actions' own CI=true and, regardless of
      # LINKCHECK, always fetches every live link and always requires
      # PROTECTED_STRINGS — the same strict build Cloudflare Pages runs for
      # dist-confidential/. Two independent CI providers checking the same commit
      # is deliberate: a push is only "built" once both agree.
      - run: npm run build
        env:
          PROTECTED_STRINGS: ${{ secrets.PROTECTED_STRINGS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
