name: Build, deploy, and verify darius.life
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Verify evidence preservation and authorization
        run: node --test workers/shared/bench-evidence.test.mjs workers/shared/bench-evidence-receipts.test.mjs workers/shared/bench-rich-text.test.mjs workers/shared/bench-crypto.test.mjs workers/confidential/src/bench-entrusted.test.mjs workers/confidential/src/bench-entrusted-evidence.test.mjs workers/confidential/src/bench-evidence-room.test.mjs
  build:
    needs: evidence-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # src/build.mjs reads the last commit date for "Last updated"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      # checks/run-all.mjs detects GitHub Actions' own CI=true and, regardless of
      # LINKCHECK, always fetches every live link and always requires
      # PROTECTED_STRINGS. Branch protection on main requires this job to pass.
      - run: npm run build
        env:
          PROTECTED_STRINGS: ${{ secrets.PROTECTED_STRINGS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-worker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/private-legal
          command: deploy
          # Uploaded to the Worker as an encrypted secret (wrangler secret put),
          # never baked into the bundle. The control panel (/control/*) uses it
          # to read and commit data/status.json and data/projects.json via the
          # GitHub API — a fine-grained PAT scoped to only this repo, Contents:
          # Read and write.
          secrets: |
            GH_COMMIT_TOKEN
        env:
          GH_COMMIT_TOKEN: ${{ secrets.GH_COMMIT_TOKEN }}

  deploy-confidential-worker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/confidential
          command: deploy
          # No secrets uploaded through the action itself; the entrusted section's
          # signing key is handled by the step below.
      # The entrusted section (/entrusted/*, "everybody else") signs its session
      # cookie with ENTRUSTED_COOKIE_SECRET. Use the repo secret if one is set;
      # otherwise make sure the Worker has SOME key (generated here, never logged)
      # so guests can always sign in. Rotating it signs out every open guest session.
      - name: Make sure the entrusted section has its cookie-signing secret
        working-directory: workers/confidential
        run: |
          if [ -n "$ENTRUSTED_COOKIE_SECRET" ]; then
            npx wrangler secret put ENTRUSTED_COOKIE_SECRET <<< "$ENTRUSTED_COOKIE_SECRET"
          elif ! npx wrangler secret list | grep -q '"ENTRUSTED_COOKIE_SECRET"'; then
            openssl rand -hex 32 | npx wrangler secret put ENTRUSTED_COOKIE_SECRET
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENTRUSTED_COOKIE_SECRET: ${{ secrets.ENTRUSTED_COOKIE_SECRET }}

  verify-live:
    # Brief v2.1 check 18: gates the workflow. No continue-on-error here — a live
    # regression fails this job, which fails the workflow, which notifies. The
    # daily-only run (verify-live.yml) is the one that reports without blocking.
    needs: [deploy-pages, deploy-worker, deploy-confidential-worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: node checks/live.mjs
