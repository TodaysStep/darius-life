name: Build, deploy, and verify darius.life
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # A queued older release must never overwrite a newer evidence-preservation
  # repair. The latest run still executes every validation gate.
  cancel-in-progress: true
jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Verify recovered runtime build and baseline guards
        run: node --test scripts/build-worker-runtime.test.mjs scripts/verify-worker-baseline.test.mjs workers/confidential/src/bench-frontdoor.test.mjs workers/confidential/src/index.test.mjs
      - name: Verify evidence preservation and authorization
        run: node --test workers/shared/bench-evidence.test.mjs workers/shared/bench-evidence-receipts.test.mjs workers/shared/bench-rich-text.test.mjs workers/shared/bench-crypto.test.mjs workers/confidential/src/bench-entrusted.test.mjs workers/confidential/src/bench-entrusted-evidence.test.mjs workers/confidential/src/bench-evidence-room.test.mjs
  build:
    needs: evidence-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # src/build.mjs reads the last commit date for "Last updated"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      # checks/run-all.mjs detects GitHub Actions' own CI=true and, regardless of
      # LINKCHECK, always fetches every live link and always requires
      # PROTECTED_STRINGS. Branch protection on main requires this job to pass.
      - run: npm run build
        env:
          PROTECTED_STRINGS: ${{ secrets.PROTECTED_STRINGS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-worker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Verify the existing private Worker baseline
        run: node scripts/verify-worker-baseline.mjs private-legal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/private-legal
          wranglerVersion: '4.152.0'
          command: deploy --keep-vars

  deploy-confidential-worker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Verify the existing confidential Worker baseline
        run: node scripts/verify-worker-baseline.mjs confidential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Existing encrypted bindings survive code deployment; do not rotate them here.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/confidential
          wranglerVersion: '4.152.0'
          command: deploy --keep-vars

  verify-live:
    # Brief v2.1 check 18: gates the workflow. No continue-on-error here — a live
    # regression fails this job, which fails the workflow, which notifies. The
    # daily-only run (verify-live.yml) is the one that reports without blocking.
    needs: [deploy-pages, deploy-worker, deploy-confidential-worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: node checks/live.mjs
