name: Build, deploy, and verify darius.life
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # src/build.mjs reads the last commit date for "Last updated"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      # checks/run-all.mjs detects GitHub Actions' own CI=true and, regardless of
      # LINKCHECK, always fetches every live link and always requires
      # PROTECTED_STRINGS. Branch protection on main requires this job to pass.
      - run: npm run build
        env:
          PROTECTED_STRINGS: ${{ secrets.PROTECTED_STRINGS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-worker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/private-legal
          command: deploy
          # Uploaded to the Worker as an encrypted secret (wrangler secret put),
          # never baked into the bundle. The control panel (/control/*) uses it
          # to read and commit data/status.json and data/projects.json via the
          # GitHub API — a fine-grained PAT scoped to only this repo, Contents:
          # Read and write.
          secrets: |
            GH_COMMIT_TOKEN
        env:
          GH_COMMIT_TOKEN: ${{ secrets.GH_COMMIT_TOKEN }}
      # A separate, best-effort step rather than a second name in the action
      # above: wrangler-action hard-fails the whole job if a listed secret has
      # no value, and ENTRUSTED_COOKIE_SECRET doesn't exist as a repo secret
      # yet (add it — Settings → Secrets and variables → Actions — any random
      # 32+ byte value works; rotating it instantly signs out every open
      # Bench Notes entrusted session). Until it's added, this step is a no-op
      # and the entrusted side simply has no signing key — see
      # workers/shared/bench-crypto.js — rather than blocking every other deploy.
      - name: Upload the Bench Notes entrusted-side cookie secret, if set
        if: ${{ env.ENTRUSTED_COOKIE_SECRET != '' }}
        working-directory: workers/private-legal
        run: npx wrangler secret put ENTRUSTED_COOKIE_SECRET <<< "$ENTRUSTED_COOKIE_SECRET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENTRUSTED_COOKIE_SECRET: ${{ secrets.ENTRUSTED_COOKIE_SECRET }}

  deploy-confidential-worker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/confidential
          command: deploy
          # No secrets to upload — Bench Notes' working side needs no
          # credential of its own; it reads/writes only the shared D1
          # database, and confidentiality is enforced by the pre-existing
          # Cloudflare Access application on confidential.darius.life
          # itself, reused as-is (see workers/confidential/wrangler.toml).

  verify-live:
    # Brief v2.1 check 18: gates the workflow. No continue-on-error here — a live
    # regression fails this job, which fails the workflow, which notifies. The
    # daily-only run (verify-live.yml) is the one that reports without blocking.
    needs: [deploy-pages, deploy-worker, deploy-confidential-worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: node checks/live.mjs
