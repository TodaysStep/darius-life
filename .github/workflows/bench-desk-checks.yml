name: Bench Notes private sharing checks
on:
  pull_request:
    paths: ['workers/**', '.github/workflows/bench-desk-checks.yml']
jobs:
  bench-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test workers/confidential/src/*.test.mjs workers/private-legal/src/*.test.mjs workers/shared/*.test.mjs
