name: Bench Notes read-only readiness
on:
  push:
    branches: [codex/bench-notes-publishing-desk-20260930]
    paths:
      - scripts/bench-desk-readiness.py
      - .github/workflows/bench-desk-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only deployment flags and Cloudflare resource metadata
        run: python3 scripts/bench-desk-readiness.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BENCH_OWNER_EMAIL: ${{ secrets.BENCH_OWNER_EMAIL }}
          BENCH_DESK_OWNER_ID: ${{ secrets.BENCH_DESK_OWNER_ID }}
          BENCH_DESK_PRINCIPALS: ${{ secrets.BENCH_DESK_PRINCIPALS }}
