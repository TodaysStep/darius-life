# Deploys ONLY dist-confidential/ (built by `npm run build`, which this project's
# "Build command" runs first) as a static-assets Worker on confidential.darius.life.
# No Worker script: this is an assets-only deployment, so `main` is intentionally
# absent. dist/ (the public page) is never touched by this file — it goes to
# GitHub Pages via .github/workflows/pages.yml instead. See docs/cloudflare-setup.md.
name = "darius-life-confidential"
compatibility_date = "2026-09-27"

[assets]
directory = "./dist-confidential"
not_found_handling = "404-page"
